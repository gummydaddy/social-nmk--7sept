{% extends 'landing_page.html' %}
{% load static %}

{% block main_content %}
<div style="max-width:420px;margin:60px auto;text-align:center;">
    {% if group.icon_url %}
        <img src="{{ group.icon_url }}" style="width:96px;height:96px;border-radius:50%;object-fit:cover;">
    {% else %}
        <img src="{% static 'images/logo.png' %}" style="width:96px;height:96px;border-radius:50%;object-fit:cover;">
    {% endif %}
    <h2 style="margin:14px 0 4px;">{{ group.name }}</h2>
    <p style="color:#888;font-size:13px;">{{ group.member_count }} subscribers</p>
    {% if group.description %}<p style="margin:14px 0;">{{ group.description }}</p>{% endif %}

    <form method="post" action="{% url 'only_message:invite_landing_view' code=group.invite_code %}">
        {% csrf_token %}
        <button type="submit"
                style="background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;border:none;
                       border-radius:22px;padding:11px 28px;font-weight:700;font-size:14px;cursor:pointer;">
            Join Channel
        </button>
    </form>
</div>
{% endblock %}
